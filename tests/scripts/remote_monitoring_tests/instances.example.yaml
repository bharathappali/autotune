# Default multi-instance RM config.
# Bare tags resolve to quay.io/kruize/autotune_operator:<tag>
# Optional: default_image_repo: quay.io/kruize/autotune_operator
#
# namespace is optional; when omitted it equals id.
# Preflight refuses to run if any target namespace already exists.

instances:
